<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center pt-20">

    <div class="max-w-2xl w-full px-6">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
                Download <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Viral Media</span>
            </h1>
            <p class="text-lg text-gray-500">Perfectly adapted for TikTok, X (Twitter), Instagram, Facebook & Reddit.</p>
        </div>

        <div class="bg-white p-2 rounded-2xl shadow-xl flex flex-col sm:flex-row gap-2 border border-gray-100 relative z-10">
            <input type="text" id="urlInput" placeholder="Paste link here (TikTok, X, IG...)" 
                   class="flex-1 px-5 py-4 text-gray-700 outline-none rounded-xl bg-transparent">
            <button id="downloadBtn" onclick="parseVideo()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition-all duration-200">
                Parse Video
            </button>
        </div>

        <div id="loading" class="hidden text-center mt-8 text-gray-500">
            <i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
            <p>Engaging multi-core engines... Please wait.</p>
        </div>

        <div id="resultCard" class="hidden mt-8 bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-6 truncate" id="videoTitle">Ready to Download!</h2>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <a id="videoLink" target="_blank" href="#" 
                   class="flex-1 bg-green-500 hover:bg-green-600 text-white text-center font-bold py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-video"></i> Download Video
                </a>
                <a id="audioLink" target="_blank" href="#" 
                   class="flex-1 bg-purple-500 hover:bg-purple-600 text-white text-center font-bold py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-download"></i> Alternate Link
                </a>
            </div>

            <div class="mt-8 p-4 bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-xl text-center">
                <p class="text-sm font-bold text-blue-800 mb-2">🚀 Build Your Own Matrix!</p>
                <p class="text-xs text-blue-600 mb-3">Join our private community for automated growth strategies.</p>
                <a href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-6 rounded-full inline-block transition-all shadow-sm">
                    Enter VIP Group &rarr;
                </a>
            </div>
        </div>
    </div>

    <script>
        async function parseVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert("⚠️ Please paste a link first!");
                return;
            }

            // 拦截 YouTube
            if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                alert("⚠️ YouTube downloads are currently restricted. Please try TikTok, X, IG, or Reddit.");
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');

            try {
                // 极度凶狠的网址清洗器
                let cleanUrl = urlInput.split('?si=')[0].split('&list=')[0].split('?utm_')[0].split('?igsh=')[0];
                let finalTitle = "Media Ready";
                let finalVideoUrl = "";
                let fallbackUrl = "";

                // ==========================================
                // 🚀 核心路由系统：根据平台分发到最强后门
                // ==========================================

                if (cleanUrl.includes('tiktok.com')) {
                    // 【引擎 1】TikTok 专线
                    const res = await fetch('https://www.tikwm.com/api/?url=' + encodeURIComponent(cleanUrl));
                    const data = await res.json();
                    if (data.code === 0) {
                        finalTitle = data.data.title || "TikTok Video";
                        finalVideoUrl = data.data.play;
                        fallbackUrl = data.data.music;
                    } else {
                        throw new Error("TikTok link invalid or private.");
                    }
                } 
                else if (cleanUrl.includes('x.com') || cleanUrl.includes('twitter.com')) {
                    // 【引擎 2】Twitter (X) 绝密专线 (vxtwitter)
                    // 将推特链接转换成 API 接口链接
                    const vxUrl = cleanUrl.replace('x.com', 'api.vxtwitter.com').replace('twitter.com', 'api.vxtwitter.com');
                    const res = await fetch(vxUrl);
                    const data = await res.json();
                    
                    if (data && data.media_extended && data.media_extended.length > 0) {
                        finalTitle = "X (Twitter) Video";
                        finalVideoUrl = data.media_extended[0].url;
                        fallbackUrl = finalVideoUrl;
                    } else {
                        throw new Error("No video found in this Tweet, or account is private.");
                    }
                }
                else {
                    // 【引擎 3】Instagram / Facebook / Reddit 通用通道
                    // 直连 Cobalt，不走代理（官方其实支持跨域，代理反而会被拦截）
                    const targetApi = 'https://api.cobalt.tools/api/json';
                    const res = await fetch(targetApi, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            url: cleanUrl,
                            vQuality: "1080" 
                        })
                    });
                    
                    const data = await res.json();
                    
                    if (data.status === "redirect" || data.status === "stream" || data.status === "success") {
                        finalTitle = "Social Media Video";
                        finalVideoUrl = data.url;
                        fallbackUrl = data.url; 
                    } else {
                        throw new Error("Platform restricted or post is private.");
                    }
                }

                // 渲染最终数据
                document.getElementById('videoTitle').innerText = finalTitle;
                document.getElementById('videoLink').href = finalVideoUrl;
                document.getElementById('audioLink').href = fallbackUrl;
                resultCard.classList.remove('hidden');

            } catch (error) {
                alert("❌ Error: " + error.message + "\n\nTry another link or check if the post is public.");
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
