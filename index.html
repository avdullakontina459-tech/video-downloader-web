<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader - TikTok, YT, IG, X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center pt-20">

    <div class="max-w-2xl w-full px-6">
        <!-- 头部区域 -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
                Download <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Any Video</span>
            </h1>
            <p class="text-lg text-gray-500">Supports TikTok, YouTube, Instagram, Twitter (X), Facebook & Reddit.</p>
        </div>

        <!-- 输入区域 -->
        <div class="bg-white p-2 rounded-2xl shadow-xl flex flex-col sm:flex-row gap-2 border border-gray-100 relative z-10">
            <input type="text" id="urlInput" placeholder="Paste link here (e.g., https://...)" 
                   class="flex-1 px-5 py-4 text-gray-700 outline-none rounded-xl bg-transparent">
            <button id="downloadBtn" onclick="parseVideo()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition-all duration-200">
                Parse Video
            </button>
        </div>

        <!-- 状态提示 -->
        <div id="loading" class="hidden text-center mt-8 text-gray-500">
            <i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
            <p>Hacking the mainframe... Please wait.</p>
        </div>

        <!-- 结果卡片 -->
        <div id="resultCard" class="hidden mt-8 bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-6 truncate" id="videoTitle">Ready to Download!</h2>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <a id="videoLink" target="_blank" href="#" 
                   class="flex-1 bg-green-500 hover:bg-green-600 text-white text-center font-bold py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-video"></i> Download Video
                </a>
                <a id="audioLink" target="_blank" href="#" 
                   class="flex-1 bg-purple-500 hover:bg-purple-600 text-white text-center font-bold py-4 px-6 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-music"></i> Download Audio
                </a>
            </div>

            <!-- 私域引流钩子 (预留位) -->
            <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500 mb-3">🔥 Want to make viral videos?</p>
                <a href="#" class="text-blue-600 font-semibold hover:underline border border-blue-200 bg-blue-50 py-2 px-4 rounded-lg inline-block">
                    Join our VIP Creators Group (Free) ->
                </a>
            </div>
        </div>
    </div>

    <script>
        async function parseVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert("Please paste a link first!");
                return;
            }

            // UI 切换为加载状态
            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');

            try {
                // 1. 终极网址清洗器：去除所有平台的追踪尾巴和播放列表参数
                let cleanUrl = urlInput.split('?si=')[0]
                                       .split('&list=')[0]
                                       .split('?utm_')[0]
                                       .split('?igsh=')[0];

                let finalTitle = "Video Ready";
                let finalVideoUrl = "";
                let finalAudioUrl = "";

                // 2. 智能中央路由
                if (cleanUrl.includes('tiktok.com')) {
                    // 引擎A：TikTok 专用 (TikWM)
                    const res = await fetch('https://www.tikwm.com/api/?url=' + encodeURIComponent(cleanUrl));
                    const data = await res.json();
                    if (data.code === 0) {
                        finalTitle = data.data.title;
                        finalVideoUrl = data.data.play;
                        finalAudioUrl = data.data.music;
                    } else {
                        throw new Error("TikTok link parsing failed.");
                    }
                } 
                else {
                    // 引擎B：万能聚合通道 (Cobalt) - 支持 YT, IG, X, Reddit, Facebook 等
                    // 这里使用了官方公开的通用节点，并配置了标准的请求头
                    const res = await fetch('https://api.cobalt.tools/api/json', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            url: cleanUrl,
                            vQuality: "1080", // 尽量请求高清
                            isAudioOnly: false 
                        })
                    });
                    
                    const data = await res.json();
                    
                    if (data.status === "redirect" || data.status === "stream" || data.status === "success") {
                        finalTitle = "Media Download (YT/IG/X)";
                        finalVideoUrl = data.url;
                        finalAudioUrl = data.url; 
                    } else {
                        throw new Error("This platform might be temporarily blocked by the public API.");
                    }
                }

                // 3. 渲染结果
                document.getElementById('videoTitle').innerText = finalTitle;
                document.getElementById('videoLink').href = finalVideoUrl;
                document.getElementById('audioLink').href = finalAudioUrl;
                resultCard.classList.remove('hidden');

            } catch (error) {
                // 如果公开接口挂了，给出优雅的提示
                alert("❌ Parse Error: " + error.message + "\n\nTip: The public server might be busy. Please try again in a few minutes.");
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
