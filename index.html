<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader Pro | No Watermark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="max-w-3xl w-full mx-auto p-6 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-6">
            Download <span class="text-blue-600">TikTok & YouTube</span> Videos
        </h1>
        <p class="text-lg text-gray-600 mb-10">Fast, Free, and No Watermark. Just paste the link below.</p>

        <div class="bg-white p-2 rounded-full shadow-lg flex items-center border border-gray-200 mb-8">
            <input type="text" id="videoUrl" placeholder="Paste video URL here (e.g., https://youtu.be/...)" 
                   class="w-full py-4 px-6 text-gray-700 leading-tight focus:outline-none rounded-l-full text-lg">
            <button onclick="fetchVideo()" id="downloadBtn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full transition duration-300 text-lg flex-shrink-0">
                Parse Video
            </button>
        </div>

        <div id="loading" class="hidden text-gray-500 mb-8">
            <i class="fas fa-spinner fa-spin text-2xl"></i> Parsing data... Please wait.
        </div>

        <div id="resultCard" class="hidden bg-white rounded-2xl shadow-xl overflow-hidden text-left border border-gray-100">
            <div class="p-6 border-b border-gray-100">
                <h3 id="videoTitle" class="font-bold text-xl text-gray-800 line-clamp-2">Video Title Goes Here</h3>
            </div>
            <div class="p-6 bg-gray-50 flex flex-col sm:flex-row gap-4">
                <a id="videoLink" href="#" target="_blank" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-center font-bold py-3 px-4 rounded-lg transition duration-300">
                    <i class="fas fa-video mr-2"></i> Download Video (No Watermark)
                </a>
                <a id="audioLink" href="#" target="_blank" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white text-center font-bold py-3 px-4 rounded-lg transition duration-300">
                    <i class="fas fa-music mr-2"></i> Download Audio (MP3)
                </a>
            </div>
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert("Please paste a valid video URL first.");
                return;
            }

            // 切换为加载状态
            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');

            try {
                let finalVideoTitle = "Ready to Download!";
                let finalVideoUrl = "";
                let finalAudioUrl = "";

                // 🧠 智能路由：判断老外输入的是哪家网站的链接
                if (urlInput.includes('tiktok.com')) {
                    // 🚀 引擎 1：TikTok 专用通道 (TikWM)
                    const apiUrl = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(urlInput);
                    const response = await fetch(apiUrl);
                    const json = await response.json();
                    
                    if (json.code === 0) {
                        finalVideoTitle = json.data.title || "TikTok Video";
                        finalVideoUrl = json.data.play;
                        finalAudioUrl = json.data.music;
                    } else {
                        throw new Error("TikTok link invalid or blocked.");
                    }
                } 
                else if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                    // 🛸 引擎 2：YouTube 专用通道 (Cobalt 开源神器)
                    const response = await fetch('https://api.cobalt.tools/api/json', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ url: urlInput })
                    });
                    const json = await response.json();
                    
                    if (json.status === "redirect" || json.status === "stream") {
                        finalVideoTitle = "YouTube Video";
                        finalVideoUrl = json.url;
                        finalAudioUrl = json.url; // Cobalt 默认给最高清音视频一体包
                    } else {
                        throw new Error("YouTube link invalid or blocked.");
                    }
                } 
                else {
                    // 拦截垃圾链接
                    alert("⚠️ Please enter a valid TikTok or YouTube link!");
                    return; 
                }

                // 🎯 统一渲染：把拿到的直链挂到绿色按钮上
                document.getElementById('videoTitle').innerText = finalVideoTitle;
                document.getElementById('videoLink').href = finalVideoUrl;
                document.getElementById('audioLink').href = finalAudioUrl;
                
                resultCard.classList.remove('hidden');

            } catch (error) {
                alert("❌ Error: " + error.message + " (Please try again)");
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
