<script>
        async function parseVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert("⚠️ Please paste a valid link first!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.classList.add('opacity-70');
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');
            loadingText.innerText = "Connecting to Premium API Engine...";

            try {
                // 清洗链接
                let cleanUrl = urlInput.split('?si=')[0].split('&list=')[0].split('?utm_')[0].split('?igsh=')[0];
                
                // 🚀 唯一通道：全部打给你自己建立的 Cloudflare 商业大脑！
                const workerUrl = 'https://video-api.lindseyclaribel611.workers.dev/';
                
                const res = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: cleanUrl })
                });
                
                const data = await res.json();
                
                if (data.success && data.url) {
                    document.getElementById('videoTitle').innerHTML = `<i class="fas fa-check-circle text-green-400"></i> Media Ready`;
                    document.getElementById('videoLink').href = data.url;
                    
                    // 隐藏备用按钮，因为 API 直接吐了最终链接
                    document.getElementById('audioLink').classList.add('hidden');
                    
                    resultCard.classList.remove('hidden');
                } else {
                    // 如果后端报错，直接吐出错误信息
                    throw new Error(data.error || "Failed to extract. Ensure the post is public.");
                }

            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-bolt"></i> Extract';
                btn.classList.remove('opacity-70');
                loading.classList.add('hidden');
            }
        }
    </script>
